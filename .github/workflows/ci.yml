name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Qt offscreen, OpenCV, ONNX Runtime, fonts, tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1 libegl1 libxkbcommon0 \
            fonts-dejavu-core fonts-lohit-deva tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test suite
        run: python -m pytest tests -rs

  license-gate:
    name: license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the report and check for unresolved licenses
        run: python scripts/license_report.py --check --out /tmp/LICENSES.md

  docker:
    name: web image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vectovecto:ci .

      - name: Run and check HTTP 200
        run: |
          docker run -d --name vectovecto-ci \
            -e VECTOVECTO_DOCUMENT_ONLY=1 \
            -p 7860:7860 vectovecto:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7860/ || true)
            if [ "$code" = "200" ]; then echo "up after ${i} tries"; exit 0; fi
            sleep 10
          done
          echo "container logs:"; docker logs vectovecto-ci | tail -50
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f vectovecto-ci || true
