name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Qt offscreen, OpenCV, ONNX Runtime, fonts, tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1 libegl1 libxkbcommon0 \
            fonts-dejavu-core fonts-lohit-deva tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r webapp/requirements-web.txt

      - name: Test suite
        run: python -m pytest tests -rs

  license-gate:
    name: license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the report and check for unresolved licenses
        run: python scripts/license_report.py --check --out /tmp/LICENSES.md

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Build the studio
        working-directory: webapp/frontend
        run: |
          npm ci
          npm run build

  docker:
    name: web image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t veriscript:ci .

      - name: Run and check the health endpoint
        run: |
          docker run -d --name veriscript-ci -p 8000:8000 veriscript:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then echo "up after ${i} tries"; exit 0; fi
            sleep 10
          done
          echo "container logs:"; docker logs veriscript-ci | tail -50
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f veriscript-ci || true

  client:
    name: node client typechecks, tests, builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/veriscript-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/veriscript-client/package-lock.json

      - name: Typecheck, test, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  wheel:
    name: python wheel builds and ships its data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: System libraries (OpenCV / ONNX Runtime imports)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1

      - name: Install clean (doc path, no photo/verifier extras) and check
        run: |
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/pip install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp   # neutral cwd: the repo source must not shadow the wheel
          /tmp/wheelvenv/bin/python - <<'PY'
          from veriscript.calibration import load_calibration, resolve_calibration
          from veriscript.document.export import unicode_font_path
          from veriscript.lexicon import load_lexicon

          assert load_calibration(), "calibration JSON missing from the wheel"
          assert unicode_font_path(), "Devanagari font missing from the wheel"
          load_lexicon()  # optional data: absence is allowed, must not raise
          print("wheel smoke ok:", resolve_calibration(), unicode_font_path())
          PY
          /tmp/wheelvenv/bin/veriscript --help > /dev/null
          echo "console script ok"
