[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriscript"
version = "1.5.0"
description = "Offline document restoration: photo/scan in, searchable PDF + honest review flags out"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DontHash" }]
keywords = ["ocr", "devanagari", "nepali", "document-restore", "searchable-pdf", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "scikit-image",
  "onnxruntime",
  "Pillow",
  "jiwer",
  "rapidocr==3.9.*",
  "reportlab",
  "pypdfium2",
]

[project.optional-dependencies]
# Photo upscaling (RRDBNet / SRVGGNetCompact) runs on torch.
photo = ["torch"]
# The optional bodhan digit verifier (HF IndicOCR): torch + transformers.
verifier = ["torch", "transformers", "huggingface_hub"]
dev = [
  "pytest",
  "httpx",
  "matplotlib",
  "scipy",
  "torch",
  "pyiqa",
  "datasets",
  "transformers",
  "PySide6",
  "google-genai",
]

[project.urls]
Homepage = "https://github.com/DontHash/VeriScript"
"Live demo" = "https://veriscript.live"
Issues = "https://github.com/DontHash/VeriScript/issues"

[project.scripts]
veriscript = "veriscript.cli:main"
# Legacy alias: the console script keeps working after the rename.
vectovecto = "veriscript.cli:main"

[tool.setuptools]
# The product package and the line-recognizer training package. The evaluation
# harness stays out of the distributed wheel — it is repo tooling.
packages = [
  "veriscript",
  "veriscript.core",
  "veriscript.document",
  "veriscript.deva",
  "veriscript.photo",
  "deva_crnn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.data-files]
"fonts" = ["fonts/Mukta-Regular.ttf", "fonts/OFL.txt"]
"calibration" = ["calibration/rapidocr_devanagari_v1.json"]
