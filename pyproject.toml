[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriscript"
version = "1.3.0"
description = "Offline document restoration: photo/scan in, searchable PDF + honest review flags out"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DontHash" }]
keywords = ["ocr", "devanagari", "nepali", "document-restore", "searchable-pdf", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "scikit-image",
  "torch",
  "onnxruntime",
  "Pillow",
  "jiwer",
  "rapidocr==3.9.*",
  "reportlab",
  "pypdfium2",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "matplotlib",
  "scipy",
  "pyiqa",
  "datasets",
  "transformers",
  "PySide6",
  "google-genai",
]

[project.urls]
Homepage = "https://github.com/DontHash/VeriScript"
Issues = "https://github.com/DontHash/VeriScript/issues"

[project.scripts]
veriscript = "cli:main"
# Legacy alias: the console script keeps working after the rename.
vectovecto = "cli:main"

[tool.setuptools]
# Product modules only. The training package (`deva_crnn/`) and the evaluation
# harness stay out of the distributed wheel — they are repo tooling.
py-modules = [
  "calibration",
  "cli",
  "degradation_document",
  "deva_reader",
  "doc_data",
  "doc_metrics",
  "document_export",
  "document_layout",
  "document_ocr",
  "document_orientation",
  "document_pipeline",
  "document_restore",
  "document_router",
  "document_verifier",
  "lexicon",
  "logging_setup",
  "branding",
  "rrdbnet",
  "smart_upscaler",
  "sr_engine",
  "srvggnet",
  "vector_raster_hybrid",
]
packages = ["deva_crnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.data-files]
"fonts" = ["fonts/Mukta-Regular.ttf", "fonts/OFL.txt"]
